<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<title>HEYDI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HEYDI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#efede8; --text:#1d1d1f; --muted:#6b6b70;
  --line:#e2dfd8; --accent:#2f5bd3; --accent-text:#ffffff; --good:#2e8b57; --warn:#c7851a; --bad:#c43d3d;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141416; --surface:#1e1e21; --surface2:#28282c; --text:#f2f2f4; --muted:#9a9aa2;
    --line:#333338; --accent:#6d8ff0; --accent-text:#0f1220; --good:#5cbf86; --warn:#e0a84a; --bad:#e46a6a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(166px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
header.top h1{font-size:22px;margin:0;font-weight:700;padding-left:17px}
.flag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px;display:flex;align-items:center;gap:6px}
.back{border:none;background:none;padding:6px 0 6px 17px;color:var(--accent);font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px 16px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-text);text-align:center}
.btn.sec{background:var(--surface2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}
.btn + .btn{margin-top:10px}
.row{display:flex;gap:10px}
.row > *{flex:1}
.rate .btn{padding:14px 6px;font-size:15px}
.rate .b1{background:var(--good);color:#fff}
.rate{margin-bottom:16px}
.rate .btn{flex:1 1 0;margin:0}
.rate .b2{background:var(--warn);color:#fff}
.rate .b3{background:var(--bad);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
select.full,input.full,textarea.full{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:12px 0}
.list .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.list .item:last-child{border-bottom:none}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.learning{color:var(--accent)}
.chip.known{color:var(--good)}
.addbtn{border:1px dashed var(--line);background:none;border-radius:12px;padding:12px 16px;width:100%;text-align:left;color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--good)}
h2{font-size:17px;margin:20px 0 4px;padding-left:17px}
select.full{-webkit-appearance:none;appearance:none;padding-right:44px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23888%27 stroke-width=%272.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27m6 9 6 6 6-6%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 16px center;background-size:16px}
h3{font-size:14px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* word card */
.w-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.w-word{font-size:28px;font-weight:700;letter-spacing:.01em}
.w-pos{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.say{cursor:pointer;border-bottom:1px dotted var(--muted)}
.say:hover{color:var(--accent)}
.spk{border:none;background:var(--surface2);border-radius:999px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0;color:var(--accent)}
.spk svg{width:16px;height:16px}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:6px 0}
.ex{padding:10px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:none}
.tr{margin-top:6px}
.reveal{border:none;background:none;color:var(--accent);padding:0;font-size:14px}
.exbtns{display:flex;gap:6px;margin-top:8px}
.exbtns button{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:13px}
.exbtns button:disabled{opacity:.5;cursor:default}
.pat{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:8px}
.pat div{margin-top:4px;font-weight:600}
.pat div .muted{font-weight:400}
.irr{background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:10px}
textarea.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2);resize:vertical}
.front{text-align:center;padding:40px 16px}
.front .w-word{font-size:34px}
.notice{background:var(--surface2);border-radius:12px;padding:12px 17px;font-size:14px;margin:12px 0}
.notice.warn{border-left:4px solid var(--warn);padding-left:13px}
.hint{padding:0 17px}
.page-title{margin:4px 0 12px;font-size:22px;padding-left:17px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:none;background:none;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
.menu{position:absolute;right:0;top:48px;min-width:190px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden;z-index:20}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:11px 12px;text-align:left;white-space:nowrap;border-radius:8px;font-size:16px}
.menu button.on{color:var(--accent);font-weight:600}
.menu button .ck{margin-left:auto}
.menu button:hover{background:var(--surface2)}
.rel{position:relative}
label.set{display:block;margin:14px 0 6px;font-weight:600}
.progress{font-size:14px;color:var(--muted);text-align:center;margin-top:8px}
.cat-title{font-size:24px;font-weight:700;padding-left:17px}
.full:disabled{opacity:.75}
textarea.full{resize:vertical;line-height:1.4;display:block}
.res{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good)}
.res.bad{border-left-color:var(--bad)}
.res-h{font-weight:600}
.res.ok .res-h{color:var(--good)} .res.bad .res-h{color:var(--bad)}
.res-sub{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px}
.res-fix{font-size:17px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px;font-weight:600;cursor:pointer}
.switch input{-webkit-appearance:none;appearance:none;width:48px;height:28px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{left:22px}
.steps{display:flex;justify-content:center;gap:8px;margin-top:4px}
.steps span{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--surface2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-text)}
.steps span.done{background:var(--good);color:#fff}
.tcard{padding:24px 16px}
.task{font-size:22px;font-weight:700;margin:10px 0 6px}
.spk.big{width:64px;height:64px}
.spk.big svg{width:30px;height:30px}
.notice.ok{border-left:4px solid var(--good);padding-left:13px}
.notice.mask{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.05em;text-align:center}
.mw{display:inline-block;white-space:nowrap;letter-spacing:.3em;margin:2px .5em}
#tin{font-size:18px}
textarea#tin{resize:vertical}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:9;border:none;border-radius:999px;padding:14px 32px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:11}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;max-width:520px;margin:0 auto;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
.sheet .card{margin:0;border-radius:18px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet .card{max-height:82vh;overflow:auto}
.mean{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.mean input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--accent);flex:none}
.mean.dis{opacity:.5;cursor:default}
.busy{display:flex;align-items:center;gap:12px;padding:6px 0;color:var(--muted)}
.spin{width:18px;height:18px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
header.top.static{position:static}
.catsel{font-size:17px;font-weight:600;margin-top:4px}
/* прогресс */
:root{--c-new:#c9c4b8;--c-learn:var(--accent);--c-known:var(--good);--c-fire:#f08a24}
@media (prefers-color-scheme: dark){:root{--c-new:#4a4a52}}
.rings{display:flex;justify-content:space-around}
.ring{text-align:center}
.rwrap{position:relative;width:104px;height:104px;margin:0 auto}
.rwrap svg{width:104px;height:104px}
.rt{fill:none;stroke:var(--surface2);stroke-width:8}
.rv{fill:none;stroke-width:8;stroke-linecap:round;stroke-dasharray:var(--len) var(--c);animation:draw 1s ease-out}
.rv.r-new{stroke:var(--accent)} .rv.r-rev{stroke:var(--good)}
@keyframes draw{from{stroke-dasharray:0 var(--c)}}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc b{font-size:24px;line-height:1}
.rc span{font-size:12px;color:var(--muted)}
.rl{font-size:13px;color:var(--muted);margin-top:6px}
.st-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.st-n{font-size:32px;color:var(--c-fire)}
.dots{display:flex;justify-content:space-between;margin-top:14px}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.dot i{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:block}
.dot.on i{background:var(--c-fire);animation:pop .4s ease-out}
.dot.today i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c-fire)}
@keyframes pop{from{transform:scale(.3)}}
.chart{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:12px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.barv{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--surface2);border-radius:8px;overflow:hidden}
.barv i{display:block;width:100%;background:var(--accent);opacity:.55;border-radius:8px;transform-origin:bottom;animation:grow .8s ease-out}
.barv i.today{opacity:1}
.col span{font-size:12px;color:var(--muted)} .col span.on{color:var(--text);font-weight:600}
@keyframes grow{from{transform:scaleY(0)}}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2);margin-top:12px}
.stack i{display:block;height:100%;transform-origin:left;animation:growx .8s ease-out}
@keyframes growx{from{transform:scaleX(0)}}
.s-new{background:var(--c-new)} .s-learn{background:var(--c-learn)} .s-known{background:var(--c-known)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--text)}
.pct{color:var(--good)}
@media (prefers-reduced-motion: reduce){.rv,.dot.on i,.barv i,.stack i{animation:none}}
</style>
</head>

/* Три примера: каждый построен на своём сочетании из карточки (1-й пример — 1-е сочетание и т.д.) */
const EX = {
  advantage:[["You should take advantage of the good weather and go for a walk.","Тебе стоит воспользоваться хорошей погодой и пойти погулять."],

  decision:[["We need to make a decision by Friday.","Нам нужно принять решение до пятницы."],

    ["The final decision is yours.","Окончательное решение за тобой."]],
  improve:[["Watching films is a good way to improve your English.","Смотреть фильмы — хороший способ улучшить свой английский."],

    ["His health has improved significantly since last year.","Его здоровье значительно улучшилось с прошлого года."]],

async function aiFetch(path, opts={}){
  let r;
  const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 30000);
  try { r = await fetch(API + path, {...opts, signal:ctl.signal, headers:{"Content-Type":"application/json", "x-goog-api-key":S.settings.aiKey}}); }
  catch(e){ const err = new Error(e.name==="AbortError" ? "ИИ отвечает слишком долго. Попробуйте ещё раз." : "Нет связи с ИИ. Проверьте интернет."); err.status = 0; throw err; }
  finally { clearTimeout(timer); }
  if (!r.ok){ let b={}; try { b = await r.json(); } catch(e){} const err = new Error(aiError(r.status, b)); err.status = r.status; err.raw = b?.error?.message || ""; throw err; }
  return r.json();
}
const noThink = new Set(); // модели, которые не принимают настройку «минимум размышлений»
// fast = true — быстрая модель (разбор слова), иначе основная (карточки и примеры).
// Если модель перегружена или недоступна, автоматически пробуем следующую.
async function gemini(prompt, schema, fast=false){
  if (!aiReady()) throw new Error("Сначала добавьте ключ ИИ в «Настройках».");
  const first = fast ? (S.settings.aiFast || S.settings.aiModel) : S.settings.aiModel;
  const busy = S.settings.aiBusy || (S.settings.aiBusy = {}), now = Date.now();
  const all = [first, ...(S.settings.aiModels||[]).map(m=>m.id).filter(id=>id!==first)];
  // перегруженные недавно модели — в конец очереди на 15 минут
  const order = [...all.filter(id=>!(busy[id] > now)), ...all.filter(id=>busy[id] > now)].slice(0, 4);
  let lastErr;
  for (const model of order){
    const gen = {responseMimeType:"application/json", responseSchema:schema, temperature:0.7};
    if (!noThink.has(model)) gen.thinkingConfig = {thinkingLevel:"minimal"};
    try {
      const j = await aiFetch(`/models/${encodeURIComponent(model)}:generateContent`, {method:"POST", body:JSON.stringify({contents:[{role:"user", parts:[{text:prompt}]}], generationConfig:gen})});
      const text = (j.candidates?.[0]?.content?.parts || []).filter(p=>!p.thought).map(p=>p.text||"").join("");
      try { return JSON.parse(text); } catch(e){ lastErr = new Error("ИИ ответил непонятно. Попробуйте ещё раз."); continue; }
    } catch(e){
      lastErr = e;
      if (e.status===400 && /thinking/i.test(e.raw) && gen.thinkingConfig){ noThink.add(model); order.splice(order.indexOf(model)+1, 0, model); continue; } // повторить ту же модель без этой настройки
      if (e.status===429 || e.status===404 || e.status>=500 || e.status===0){ busy[model] = Date.now() + 15*60000; save(); continue; } // перегружена / нет доступа — следующая модель
      throw e;
    }
  }
  throw lastErr;
}
async function aiModels(){
  const j = await aiFetch(`/models?pageSize=200`);
  return (j.models||[])
    .filter(m => (m.supportedGenerationMethods||[]).includes("generateContent") && /flash/i.test(m.name) && !/(image|tts|audio|live|embed|vision|8b|omni)/i.test(m.name))
    .map(m => { const id = m.name.replace(/^models\//,""), v = parseFloat((id.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
      return {id, name:m.displayName||id, score: v*10 - (/lite/i.test(id)?3:0) - (/(preview|exp)/i.test(id)?6:0) - (/-\d{3}$/.test(id)?0.5:0)}; })
    .sort((a,b)=>b.score-a.score).map(({id,name})=>({id,name}));
}

function promptAnalyze(text, exact){

All Russian must be natural Russian. All English must be natural, modern English. Double-check spelling of every English word.
- pos: part(s) of speech in English, e.g. "adjective" or "noun, verb" (most common first).
- patterns: ONLY the grammar of the headword itself: the preposition or structure that directly follows THIS word and must be learned with it (government). Examples: "wait for someone/something", "manage to do something", "depend on something", "interested in something", "good at doing something", "advantage over someone/something", "afraid of something". For a phrasal-verb headword it may show object position ("bring someone up / bring up someone"). Rules: write the headword plus its preposition/structure only — no extra verbs or articles around it (not "take advantage of", not "have an advantage over"); NEVER list phrasal verbs (verb + particle with its own meaning, e.g. "go on", "give up", "look after") — those are separate words. en with "someone / something / doing something / to do something"; ru: short Russian equivalent. Up to 2. Empty array if the word has no such government (most nouns and many adjectives have none).

- irregular: has=true only if something is irregular: irregular verb (label "Неправильный глагол", forms like "go — went — gone", speak=true); irregular plural (label "Мн. ч. (нестандартное)", forms like "children", speak=true); uncountable noun (label "Неисчисляемое", forms = short Russian note like "нет множественного числа: some information, a piece of information", speak=false); irregular comparison (label "Неправильные степени сравнения", forms like "bad — worse — worst", speak=true). Otherwise has=false with empty strings.

function promptExample(c, i, mode){
  const cur = c.ex[i], lvl = cur[2] || c.level, li = Math.max(0, LEVELS.indexOf(lvl));
  const target = mode==="easier" ? LEVELS[Math.max(0, li-1)] : mode==="harder" ? LEVELS[Math.min(5, li+1)] : lvl;
  const how = mode==="easier" ? " It must be simpler than the current one: shorter, easier words and grammar." : mode==="harder" ? " It must be more advanced than the current one: richer vocabulary and grammar." : "";
  return {target, prompt:`Write one example sentence for a vocabulary flashcard for a Russian-speaking learner of English.
Word: «${c.word}» (${c.pos}), meaning: «${c.meaning}».
The sentence must use the collocation «${(c.coll[i]||c.coll[0]||[c.word])[0]}» (it may be inflected).
Current sentence: «${cur[0]}». Write a NEW, different, natural sentence at CEFR level ${target}.${how}
Return en, ru (natural Russian translation) and level.`};
}
// Сочетания, которые по сути повторяют блок «Употребляется»
function overlapColl(card){
  const norm = s => " " + s.toLowerCase().replace(/someone's|somebody's|one's|someone|somebody|something|doing|to do|sb|sth|[\/(),.]/g, " ").replace(/\s+/g, " ").trim() + " ";
  const hw = new Set(norm(card.word).trim().split(" "));
  // конструкция должна добавлять к слову что-то своё (для фразовых глаголов «bring someone up» = просто само слово)
  const pats = (card.pat||[]).map(p=>norm(p[0])).filter(p=>p.trim().split(" ").some(x=>!hw.has(x)));
  return card.coll.filter(c=>{ const x = norm(c[0]); return pats.some(p=>x.includes(p) || p.includes(x)); }).map(c=>c[0]);
}
async function aiCard(head, sense){
  let card = buildCard(head, await gemini(promptCard(head, sense), SCH_CARD), sense);
  const dup = overlapColl(card);
  if (dup.length){ // одна повторная попытка с явным запретом
    try { const again = buildCard(head, await gemini(promptCard(head, sense, dup), SCH_CARD), sense);
      if (again.coll.length && again.ex.length && overlapColl(again).length < dup.length) card = again; } catch(e){}
  }
  return card;
}
function buildCard(head, r, sense){
  const pairs = a => (a||[]).filter(x => x && x.en).map(x => [x.en, x.ru||""]);
  const lvl = LEVELS.includes(r.level) ? r.level : "B1";
  return { word:head, sense:sense?.ru||"", pos:r.pos||"", pat:pairs(r.patterns).slice(0,3), meaning:r.meaning||"", level:lvl,
    freq:Math.max(1, Math.min(10, Math.round(+r.freq||5))), style:r.style||"нейтральный",
    irr: r.irregular?.has && r.irregular.forms ? {label:r.irregular.label||"Особая форма", forms:r.irregular.forms, say:!!r.irregular.speak} : null,
    coll:pairs(r.collocations).slice(0,3), ex:pairs(r.examples).slice(0,3).map(p=>[p[0], p[1], lvl]),
    syn:(r.synonyms||[]).slice(0,4), ant:(r.antonyms||[]).slice(0,3), fam:pairs(r.family).slice(0,4) };
}

/* ---------- Помощники ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const spk = t => `<button class="spk" data-say="${esc(t)}" aria-label="Озвучить">${SPK}</button>`;
const say = t => `<span class="say" data-say="${esc(t)}">${esc(t)}</span>`;
const L = () => S.langs[S.lang];
const words = () => Object.values(L().words);
function inCat(w, catId){ return catId==="all" || w.cats.includes(catId); }
function catName(id){ const c = L().cats.find(c=>c.id===id); return c ? c.name : "—"; }
function isKnown(w){ return w.status==="skipped" || (w.status==="learning" && w.stage>=KNOWN_STAGE); }
function statusChip(w){
  if (w.status==="new") return '<span class="chip">новое</span>';
  if (isKnown(w)) return '<span class="chip known">выучено</span>';
  return '<span class="chip learning">на изучении</span>';
}
function LOG(){ return S.log[S.lang] || (S.log[S.lang]={}); }
function logDay(){ const k=dkey(), g=LOG(); return g[k] || (g[k]={reviews:0,started:0}); }
function startedToday(){ return (LOG()[dkey()]||{}).started||0; }
function dueWords(catId){ const end = dayStart()+DAY; return words().filter(w=>inCat(w,catId) && w.status==="learning" && w.due < end); }
function reviewPool(catId){
  if (S.settings.mode==="schedule") return dueWords(catId);
  return words().filter(w=>inCat(w,catId) && w.status==="learning");
}
function newWords(catId){ return words().filter(w=>inCat(w,catId) && w.status==="new").sort((a,b)=>a.added-b.added); }
function newLeft(){ return Math.max(0, S.settings.newPerDay - startedToday()); }
function streak(){
  let n=0, t=dayStart();
  const active = k => { const d=LOG()[k]; return d && (d.reviews>0 || d.started>0 || d.trained>0); };
  if (!active(dkey(t))) t -= DAY; // сегодня ещё не занимался — серия не прервана
  while (active(dkey(t))){ n++; t -= DAY; }
  return n;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function renderCard(w){
  const c = w.card;

  let h = `<div class="card">
    <div class="w-head"><span class="w-word">${esc(c.word)}</span> ${spk(c.word)} <span class="w-pos">${esc(c.pos)}</span></div>

    <p style="margin:10px 0 0">${esc(c.meaning)}</p>

    <div class="meta"><span class="chip">Уровень: ${esc(c.level)}</span><span class="chip">Частотность: ${c.freq}/10</span><span class="chip">Стиль: ${esc(c.style)}</span></div>`;
  if (c.irr) h += `<div class="irr"><b>${esc(c.irr.label)}:</b> ${c.irr.say ? `<span class="say" data-say="${esc(c.irr.forms.replace(/—/g,","))}">${esc(c.irr.forms)}</span>` : esc(c.irr.forms)}</div>`;
  h += `<h3>Сочетания</h3><ul class="plain">${list(c.coll)}</ul>`;
  h += `<h3>Примеры (${esc(c.level)})</h3>`;

    const busy = V.exBusy && V.exBusy.wid===w.id && V.exBusy.i===i, msg = V.exMsg && V.exMsg.wid===w.id && V.exMsg.i===i ? V.exMsg.msg : "";
    const lv = e[2] && e[2]!==c.level ? ` <span class="chip">${esc(e[2])}</span>` : "";
    h += `<div class="ex"><div>${say(e[0])}${lv}</div>
      <div class="tr"><button class="reveal" data-reveal="${i}">Показать перевод</button><span class="muted" id="tr${i}" hidden>${esc(e[1])}</span></div>
      ${busy ? `<div class="busy small"><span class="spin"></span>ИИ пишет новый пример…</div>`
        : `<div class="exbtns">${[["replace","Заменить"],["easier","Проще"],["harder","Сложнее"]].map(([m,t])=>`<button data-exm="${m}" data-exi="${i}" data-exw="${w.id}" ${V.exBusy?"disabled":""}>${t}</button>`).join("")}</div>`}
      ${msg ? `<div class="small" style="color:var(--bad);margin-top:6px">${esc(msg)}</div>` : ""}</div>`;
  });
  if (c.syn.length) h += `<p style="margin:14px 0 4px"><b>Синонимы:</b> ${words(c.syn)}</p>`;

/* ---------- Прогресс ---------- */
const WD = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
function ring(val, max, cls, label){
  const r = 34, C = 2*Math.PI*r, p = max ? Math.min(1, val/max) : 0;
  return `<div class="ring"><div class="rwrap"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="${r}" class="rt"/>
    ${p>0 ? `<circle cx="40" cy="40" r="${r}" class="rv ${cls}" style="--len:${(p*C).toFixed(1)};--c:${C.toFixed(1)}" transform="rotate(-90 40 40)"/>` : ""}</svg>
    <div class="rc"><b>${val}</b><span>${max ? "из "+max : "на сегодня нет"}</span></div></div><div class="rl">${label}</div></div>`;
}
function stackBar(n, l, k){
  const t = n+l+k || 1;
  return `<div class="stack"><i class="s-new" style="width:${n*100/t}%"></i><i class="s-learn" style="width:${l*100/t}%"></i><i class="s-known" style="width:${k*100/t}%"></i></div>
    <div class="legend"><span><i class="s-new"></i>новые <b>${n}</b></span><span><i class="s-learn"></i>на изучении <b>${l}</b></span><span><i class="s-known"></i>выучено <b>${k}</b></span></div>`;
}
function counts(list){
  const k = list.filter(isKnown).length, l = list.filter(w=>w.status==="learning" && !isKnown(w)).length;
  return [list.length-k-l, l, k];
}
function viewProgress(sel){
  const g = LOG(), days = [];
  for (let i=6;i>=0;i--){ const t=Date.now()-i*DAY, d=g[dkey(t)]||{}; days.push({wd:WD[new Date(t).getDay()], n:(d.reviews||0)+(d.started||0)+(d.trained||0), today:i===0}); }
  const max = Math.max(1, ...days.map(d=>d.n)), week = days.reduce((a,d)=>a+d.n,0);
  const td = g[dkey()]||{}, reviewed = td.reviews||0, due = dueWords("all").length, st = streak();
  const [n,l,k] = counts(words());
  let h = `<h2>Мой прогресс</h2>
  <div class="card"><div class="small muted" style="margin-bottom:10px">Цель на сегодня</div>
    <div class="rings">${ring(td.started||0, S.settings.newPerDay, "r-new", "новые слова")}${ring(reviewed, reviewed+due, "r-rev", "повторение")}</div></div>
  <div class="card streak"><div class="st-top"><div><b class="st-n">${st}</b> <span>${plural(st,"день","дня","дней")} подряд</span></div>
    <span class="small muted">${st ? "Не прерывайте серию" : "Начните серию сегодня"}</span></div>
    <div class="dots">${days.map(d=>`<div class="dot ${d.n?"on":""} ${d.today?"today":""}"><i></i><span>${d.wd}</span></div>`).join("")}</div></div>
  <div class="card"><div class="st-top"><span class="small muted">Активность за неделю</span><b>${week}</b></div>
    <div class="chart">${days.map(d=>`<div class="col"><div class="barv"><i style="height:${d.n*100/max}%" class="${d.today?"today":""}"></i></div><span class="${d.today?"on":""}">${d.wd}</span></div>`).join("")}</div></div>
  <div class="card"><div class="st-top"><span class="small muted">Все слова</span><b>${words().length}</b></div>${stackBar(n,l,k)}</div>`;
  if (sel!=="all"){
    const [cn,cl,ck] = counts(words().filter(w=>inCat(w,sel)));
    const pct = cn+cl+ck ? Math.round(ck*100/(cn+cl+ck)) : 0;
    h += `<div class="card"><div class="st-top"><b>${esc(catName(sel))}</b><b class="pct">${pct}%</b></div>${stackBar(cn,cl,ck)}</div>`;
  }
  return h;
}
function plural(n,a,b,c){ const m10=n%10, m100=n%100; return m10===1&&m100!==11?a : m10>=2&&m10<=4&&(m100<10||m100>=20)?b : c; }

/* ---------- Резервная копия ---------- */
function exportBackup(){
  const data = JSON.parse(JSON.stringify(S));
  delete data.settings.aiKey; delete data.settings.aiBusy;
  const blob = new Blob([JSON.stringify({app:"word-cards", version:2, exported:new Date().toISOString(), data}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `heydi-kopiya-${dkey()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  const n = Object.values(S.langs).reduce((s,l)=>s+Object.keys(l.words).length, 0);
  V.bkMsg = {ok:true, text:`Копия сохранена: ${n} слов. Файл — в папке «Загрузки».`}; render();
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = () => {
    let d;
    try { d = JSON.parse(rd.result); } catch(e){ V.bkMsg = {text:"Это не файл копии: не удалось прочитать."}; return render(); }
    const data = d && d.app==="word-cards" ? d.data : null;
    if (!data || !data.langs || !data.langs.en || !data.settings){ V.bkMsg = {text:"Это не файл копии «Карточек слов»."}; return render(); }
    const n = Object.values(data.langs).reduce((s,l)=>s+Object.keys(l.words||{}).length, 0);
    if (!confirm(`Загрузить копию от ${(d.exported||"").slice(0,10)} (${n} слов)? Текущие слова, категории и прогресс на этом устройстве будут заменены.`)) return;
    const keep = {aiKey:S.settings.aiKey, aiModel:S.settings.aiModel, aiFast:S.settings.aiFast, aiModels:S.settings.aiModels};
    S = data; S.settings = {...S.settings, ...Object.fromEntries(Object.entries(keep).filter(([,v])=>v))};
    save(); V.bkMsg = {ok:true, text:`Копия загружена: ${n} слов.`}; render();
  };
  rd.readAsText(file);
}

/* ---------- Тренировка: 3 этапа ---------- */
const STAGES = ["Написание", "Словосочетания", "Своё предложение"];
const SCH_CHECK = OBJ({wordUsedCorrectly:BOOL, otherMistakes:BOOL, corrected:STR, commentRu:STR});
const normAns = s => String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[.,!?;:"«»()]/g, " ").replace(/\s+/g, " ").trim();
// Автоозвучка — только если включена в настройках; кнопки озвучки работают всегда
function autoSpeak(text){ if (S.settings.autoSpeak) speak(text); }
// Пункты этапа 2: три сочетания + конструкции из «Употребляется»
function trainItems(c){ return [...c.coll.map(x=>({en:x[0], ru:x[1], kind:"Сочетание"})), ...(c.pat||[]).map(x=>({en:x[0], ru:x[1], kind:"Употребляется"}))]; }
function answersFor(en, kind){
  const out = new Set([normAns(en)]);
  if (kind==="Употребляется"){
    const core = normAns(en.replace(/someone's|somebody's|one's|someone|somebody|something|sb|sth|somewhere|\//gi, " "));
    out.add(core); out.add(core.replace(/ (do|doing)$/, ""));
  }
  return out;
}
function startTrain(wid, from){
  const w = L().words[wid]; if (!w) return;
  go({type:"train", wid, stage:0, item:0, hint:0, msg:null, from});
  document.getElementById("tin")?.focus();
}
function trainTarget(t, c){
  if (t.stage===0) return {en:c.word};
  if (t.stage===1) return trainItems(c)[t.item];
  return null;
}
// Подсказка: открываем первые k букв, остальные — «_»; someone/something видны сразу
function maskText(target, k){
  let n = 0;
  return target.split(/\s+/).map(word => /(someone|something|somebody|somewhere)/i.test(word) ? `<span class="mw muted">${esc(word)}</span>`
    : `<span class="mw">${[...word].map(ch => /[a-zа-яё]/i.test(ch) ? (n++ < k ? esc(ch) : "_") : esc(ch)).join("")}</span>`).join(" ");
}
function hintHtml(t, c){
  if (!t.hint) return "";
  if (t.stage===2){
    const ex = c.ex[0]?.[0] || "", start = (c.ex[1]?.[0] || ex).split(" ").slice(0,3).join(" ");
    return `<div class="notice"><span class="muted">Пример:</span> ${say(ex)}${t.hint>1 ? `<br><span class="muted">Можно начать так:</span> <b>${esc(start)}…</b>` : ""}</div>`;
  }
  const target = trainTarget(t, c).en;
  const k = (t.stage===1 ? target.split(" ")[0].length : 1) + t.hint - 1;
  return `<div class="notice mask">${maskText(target, k)}</div>`;
}
function viewTrain(){
  const t = V.screen, w = L().words[t.wid];
  if (!w) return header("",{back:true}) + `<p class="muted hint">Слово не найдено.</p>`;
  const c = w.card;
  if (t.stage===3) return header("",{back:true}) + `<div class="card front"><div style="font-size:22px;font-weight:700">Тренировка пройдена</div>
      <p class="muted">Слово <b>${esc(c.word)}</b>: все три этапа.</p></div><button class="btn" data-act="back">Вернуться</button>`;
  let h = header("",{back:true}) + `<div class="steps">${STAGES.map((s,i)=>`<span class="${i<t.stage?"done":i===t.stage?"on":""}">${i+1}</span>`).join("")}</div>
    <div class="progress" style="margin-top:4px">Этап ${t.stage+1} из 3 · ${STAGES[t.stage]}</div>`;
  let task = "";
  if (t.stage===0) task = `<div class="muted small">Напишите по-английски</div><div class="task">${esc(c.meaning)}</div><div class="muted small">${esc(c.pos)}</div>`;
  if (t.stage===1){ const items = trainItems(c), it = items[t.item];
    task = `<div class="muted small">${it.kind} ${t.item+1} из ${items.length} · напишите по-английски полностью</div><div class="task">${esc(it.ru)}</div>`; }
  if (t.stage===2) task = `<div class="muted small">Придумайте своё предложение со словом</div><div class="task">${esc(c.word)}</div><div class="muted small">${esc(c.meaning.split(";").slice(0,2).join(";"))}</div>`;
  h += `<div class="card front tcard">${task}</div>`;
  h += t.stage===2
    ? `<textarea class="full" id="tin" rows="3" placeholder="Ваше предложение по-английски" autocapitalize="sentences" spellcheck="false" ${t.busy||t.passed?"disabled":""}>${esc(t.text||"")}</textarea>`
    : `<input class="full" id="tin" placeholder="Ответ" autocapitalize="off" autocomplete="off" spellcheck="false" value="${esc(t.text||"")}" ${t.ok?"disabled":""}>`;
  h += hintHtml(t, c);
  if (t.msg) h += t.msg;
  if (t.busy) h += `<div class="busy" style="margin-top:12px"><span class="spin"></span>ИИ проверяет предложение…</div>`;
  else if (t.passed) h += `<button class="btn" data-act="tnext" style="margin-top:12px">Завершить тренировку</button>`;
  else if (!t.ok) h += `<div class="row rate" style="margin-top:12px"><button class="btn sec" data-act="thint">Подсказка</button><button class="btn" data-act="tcheck">Проверить</button></div>`;
  return h;
}
function trainNext(){
  const t = V.screen, w = L().words[t.wid];
  t.hint = 0; t.msg = null; t.text = ""; t.ok = false;
  if (t.stage===1 && t.item < trainItems(w.card).length-1) t.item++;
  else { t.stage++; t.item = 0; }
  if (t.stage===3){ const d = logDay(); d.trained = (d.trained||0) + 1; save(); }
  render(); document.getElementById("tin")?.focus();
}
const resBox = (ok, title, body="") => `<div class="res ${ok?"ok":"bad"}"><div class="res-h">${title}</div>${body}</div>`;
async function trainCheck(){
  const t = V.screen, w = L().words[t.wid], c = w.card, el = document.getElementById("tin");
  const val = (el?.value || "").trim(); t.text = val; if (!val || t.ok || t.busy || t.passed) return;
  if (t.stage < 2){
    const tg = trainTarget(t, c), ok = answersFor(tg.en, tg.kind).has(normAns(val));
    if (!ok){ t.msg = resBox(false, "Неверно. Попробуйте ещё раз."); render(); const f = document.getElementById("tin"); f.focus(); f.select(); return; }
    t.ok = true; t.msg = resBox(true, "Верно"); render(); autoSpeak(tg.en);
    setTimeout(()=>{ if (V.screen===t) trainNext(); }, 1000);
    return;
  }
  if (!aiReady()){ t.msg = resBox(false, "Для проверки предложения нужен ключ ИИ в «Настройках»."); return render(); }
  t.busy = true; t.msg = null; render();
  try {
    const r = await gemini(`A Russian-speaking learner of English wrote a sentence to practise the word «${c.word}» (meaning: «${c.meaning}»).
Sentence: «${val}»
- wordUsedCorrectly: true if «${c.word}» (any grammatical form) is in the sentence and is used correctly and naturally in a fitting meaning. Ignore other mistakes for this field.
- otherMistakes: true if there are any other grammar, spelling or word-choice mistakes.
- corrected: the corrected, natural version of the whole sentence, keeping its meaning (the same sentence if there are no mistakes).
- commentRu: a very short explanation in Russian (1–2 sentences) of what is wrong; empty string if nothing is wrong.`, SCH_CHECK);
    if (V.screen!==t) return;
    t.busy = false;
    if (r.wordUsedCorrectly){
      t.passed = true;
      const fix = r.otherMistakes && r.corrected
        ? `<div class="res-sub">Другие ошибки</div><div class="small muted">${esc(r.commentRu||"")}</div><div class="res-sub">Правильно</div><div class="res-fix">${say(r.corrected)}</div>` : "";
      t.msg = resBox(true, "Верно: слово использовано правильно", fix);
      autoSpeak(r.otherMistakes && r.corrected ? r.corrected : val);
    } else t.msg = resBox(false, "Неверно: слово использовано неправильно", r.commentRu ? `<div class="small muted" style="margin-top:6px">${esc(r.commentRu)}</div>` : "");
  } catch(e){ t.busy = false; t.msg = resBox(false, esc(e.message)); }
  render();
}

/* ---------- Действия ---------- */
function go(screen){ V.screen = screen; V.delAsk = null; V.catDelAsk = null; V.menu=false; window.scrollTo(0,0); render(); }
function back(){
  const sc = V.screen;
  if (sc?.type==="word" && sc.from) return go(sc.from);
  if (sc?.type==="train") return go(sc.from || null);
  V.adding = null;
  go(null);
}

function startSession(kind){
  const sel = L().cats.some(c=>c.id===S.sel[S.lang]) ? S.sel[S.lang] : "all";
  let ids;
  if (kind==="new") ids = newWords(sel).slice(0, newLeft()).map(w=>w.id);
  else ids = shuffle(reviewPool(sel).map(w=>w.id));
  if (!ids.length) return;
  go({type:"session", kind, queue:ids, i:0, shown:false, count:0, forgot:false});
}
function nextInSession(){
  const s = V.screen;
  s.i++; s.shown=false; s.expanded=false;
  if (s.i >= s.queue.length) return go({type:"done", kind:s.kind, count:s.count});
  window.scrollTo(0,0); render();
}
function rate(r){
  const s = V.screen, w = L().words[s.queue[s.i]];
  const now = dayStart();
  if (r===2){ w.stage = Math.min(w.stage+1, INTERVALS.length-1); w.due = now + INTERVALS[w.stage]*DAY; }
  else {
    w.stage = 0; w.due = now + DAY;
    if (!s.again) s.again = {};
    if (!s.again[w.id]){ s.again[w.id]=1; s.queue.push(w.id); } // вернётся в конце этого занятия
  }
  logDay().reviews++; s.count++;
  save();
  nextInSession();
}

function createWord(){
  const a = V.adding; if (!a || a.busy) return;
  const text = (document.getElementById("newword")?.value ?? a.text ?? "").trim();
  a.text = text; if (!text) return;
  if (S.lang!=="en"){ a.msg = `<div class="notice">Карточки для турецкого появятся после английского.</div>`; return render(); }
  if (!aiReady()){ a.msg = `<div class="notice warn">Чтобы ИИ создавал карточки, добавьте ключ Gemini в «Настройках». <button class="reveal" data-act="gosettings">Открыть настройки</button></div>`; return render(); }
  analyze(text, false);
}
async function analyze(text, exact){
  const a = V.adding;
  a.busy = "ИИ разбирает слово…"; a.msg = ""; a.res = null; render();
  try {
    const r = await gemini(promptAnalyze(text, exact), SCH_ANALYZE, true);
    if (V.adding!==a) return;
    a.busy = null;
    if (r.isEnglish===false || !r.headword?.trim()){ a.msg = `<div class="notice warn">Это не похоже на английское слово. Проверьте написание.</div>`; return render(); }
    r.headword = r.headword.trim();
    if (exact) r.correction = a.text.toLowerCase()!==r.headword.toLowerCase() ? (r.correction || "") : "";
    r.senses = (r.senses||[]).filter(s=>s && s.ru).slice(0,5);
    a.res = r; a.pick = null;
    const ex = existingFor(r.headword);
    if (r.senses.length > 1){ const i = r.senses.findIndex(s=>!ex.some(w=>(w.card.sense||"").toLowerCase()===s.ru.toLowerCase())); a.pick = i>=0 ? i : null; }
    if (r.senses.length <= 1 && !(r.alternatives||[]).length && !ex.length) return makeCards(); // спрашивать нечего — сразу создаём
    render();
  } catch(e){ if (V.adding!==a) return; a.busy = null; a.msg = `<div class="notice warn">${esc(e.message)}</div>`; render(); }
}
async function makeCards(){
  const a = V.adding, r = a?.res; if (!r || a.busy) return;
  a.busy = "ИИ создаёт карточку…"; a.msg = ""; render();
  let card;
  try {
    const sense = (r.senses||[]).length > 1 && a.pick!=="all" && a.pick!=null ? r.senses[a.pick] : null;
    card = await aiCard(r.headword, sense);
    if (V.adding!==a) return;
    if (!card.coll.length || !card.ex.length || !card.meaning) throw new Error("ИИ вернул неполную карточку. Попробуйте ещё раз.");
  } catch(e){ if (V.adding!==a) return; a.busy = null; a.msg = `<div class="notice warn">${esc(e.message)}</div>`; return render(); }
  const id = uid();
  L().words[id] = { id, key:null, card, cats:[a.cat], status:"new", stage:0, due:0, note:"", added:Date.now(), started:0,
    seenAs: a.text.toLowerCase()!==r.headword.toLowerCase() ? a.text : "" };
  S.lastCat[S.lang] = a.cat; save();
  const from = V.screen; V.adding = null;
  go({type:"word", id, from});

}
async function rewriteExample(wid, i, mode){
  const w = L().words[wid]; if (!w || V.exBusy) return;
  if (!aiReady()){ V.exMsg = {wid, i, msg:"Добавьте ключ ИИ в «Настройках»."}; return render(); }
  const {target, prompt} = promptExample(w.card, i, mode);
  if (mode!=="replace" && target===(w.card.ex[i][2]||w.card.level)){ V.exMsg = {wid, i, msg: mode==="easier" ? "Проще уже некуда: это уровень A1." : "Сложнее уже некуда: это уровень C2."}; return render(); }
  V.exBusy = {wid, i}; V.exMsg = null; render();
  try {
    const r = await gemini(prompt, SCH_EX);
    if (!r.en) throw new Error("ИИ не прислал пример. Попробуйте ещё раз.");
    w.card.ex[i] = [r.en, r.ru||"", LEVELS.includes(r.level) ? r.level : target]; save();
  } catch(e){ V.exMsg = {wid, i, msg:e.message}; }
  V.exBusy = null; render();
}
function nameOf(id){ return (S.settings.aiModels||[]).find(m=>m.id===id)?.name || id; }
function modelSelect(id, label, cur){ return `<label class="set" for="${id}">${label}</label><select class="full" id="${id}">${S.settings.aiModels.map(m=>`<option value="${esc(m.id)}" ${m.id===cur?"selected":""}>${esc(m.name)}</option>`).join("")}</select>`; }
async function checkKey(){
  const el = document.getElementById("s-key"); S.settings.aiKey = (el?.value||"").trim(); save();
  if (!S.settings.aiKey){ V.keyMsg = {text:"Вставьте ключ."}; return render(); }
  V.keyMsg = {text:"Проверяю…", ok:true, busy:true}; render();
  try {
    const list = await aiModels();
    if (!list.length) throw new Error("Ключ работает, но подходящих моделей Gemini Flash не найдено.");
    S.settings.aiModels = list;
    const main = list.find(m=>!/lite/i.test(m.id)) || list[0], fast = list.find(m=>/lite/i.test(m.id)) || main;
    if (!list.some(m=>m.id===S.settings.aiModel) || /lite/i.test(S.settings.aiModel)) S.settings.aiModel = main.id;
    if (!list.some(m=>m.id===S.settings.aiFast)) S.settings.aiFast = fast.id;
    save(); V.keyMsg = {ok:true, text:"Ключ работает. Карточки: " + nameOf(S.settings.aiModel) + ". Разбор слова: " + nameOf(S.settings.aiFast) + "."};
  } catch(e){ V.keyMsg = {text:e.message}; }
  render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-say],[data-act],[data-tab],[data-lang],[data-cat],[data-word],[data-rate],[data-reveal],[data-addhere],[data-alt],[data-exm]");
  if (!t){ if (V.menu){ V.menu=false; render(); } return; }
  if (t.dataset.say !== undefined && !t.dataset.act){ speak(t.dataset.say); return; }
  if (t.dataset.tab){ V.tab=t.dataset.tab; V.screen=null; V.adding=null; V.addCat=false; V.menu=false; window.scrollTo(0,0); return render(); }
  if (t.dataset.lang){ S.lang=t.dataset.lang; V.menu=false; V.screen=null; save(); return render(); }
  if (t.dataset.cat){ V.adding=null; return go({type:"cat", id:t.dataset.cat}); }
  if (t.dataset.word) return go({type:"word", id:t.dataset.word, from:V.screen});
  if (t.dataset.rate) return rate(+t.dataset.rate);
  if (t.dataset.reveal !== undefined){ const el=document.getElementById("tr"+t.dataset.reveal); el.hidden=false; t.remove(); return; }
  if (t.dataset.addhere){ const w=L().words[t.dataset.addhere]; const c=V.adding.cat; if(!w.cats.includes(c)) w.cats.push(c); S.lastCat[S.lang]=c; save(); V.adding=null; return go({type:"word", id:w.id, from:V.screen}); }
  if (t.dataset.alt !== undefined && V.adding?.res){ const x = V.adding.res.alternatives[+t.dataset.alt]; if (x) analyze(x.headword, true); return; }
  if (t.dataset.exm) return rewriteExample(t.dataset.exw, +t.dataset.exi, t.dataset.exm);
  const a = t.dataset.act;
  if (a==="back") return back();
  if (a==="delask"){ V.delAsk = V.screen.id; render(); window.scrollTo(0, document.body.scrollHeight); return; }
  if (a==="catdelask"){ V.catDelAsk = V.screen.id; render(); window.scrollTo(0, document.body.scrollHeight); return; }
  if (a==="catdelcancel"){ V.catDelAsk = null; return render(); }
  if (a==="catdel"){ const c = V.screen.id;
    for (const w of words()) if (w.cats.includes(c)){ w.cats = w.cats.filter(x=>x!==c); if (!w.cats.length) delete L().words[w.id]; }
    L().cats = L().cats.filter(x=>x.id!==c); if (S.sel[S.lang]===c) S.sel[S.lang]="all"; if (S.lastCat[S.lang]===c) S.lastCat[S.lang]=L().cats[0]?.id||null;
    save(); V.catDelAsk = null; return go(null); }
  if (a==="delcancel"){ V.delAsk = null; return render(); }
  if (a==="delword"){ delete L().words[V.screen.id]; save(); V.delAsk = null; return back(); }
  if (a==="uncat"){ const w = L().words[V.screen.id], c = V.screen.from.id; w.cats = w.cats.filter(x=>x!==c); save(); V.delAsk = null; return back(); }
  if (a==="langmenu"){ V.menu=!V.menu; return render(); }
  if (a==="startnew") return startSession("new");
  if (a==="startreview") return startSession("review");
  if (a==="train") return startTrain(t.dataset.wid, V.screen);
  if (a==="thint"){ const tr = V.screen; tr.hint++; render(); document.getElementById("tin")?.focus(); return; }
  if (a==="tcheck") return trainCheck();
  if (a==="tnext") return trainNext();
  if (a==="expand"){ V.screen.expanded = true; return render(); }
  if (a==="collapse"){ V.screen.expanded = false; render(); window.scrollTo(0,0); return; }
  if (a==="show"){ V.screen.shown=true; window.scrollTo(0,0); render(); const w=L().words[V.screen.queue[V.screen.i]]; if (S.settings.front==="ru") autoSpeak(w.card.word); return; }
  if (a==="learnword"||a==="skipword"){
    const s=V.screen, w=L().words[s.queue[s.i]];
    w.started = Date.now(); logDay().started++;
    if (a==="learnword"){ w.status="learning"; w.stage=0; w.due=dayStart()+DAY; s.count++; } else w.status="skipped";
    save(); return nextInSession();
  }
  if (a==="addcat"){ V.addCat=true; return render(); }
  if (a==="cancelcat"){ V.addCat=false; return render(); }
  if (a==="savecat"){ const n=document.getElementById("newcat").value.trim(); if(!n) return; const c={id:uid(),name:n}; L().cats.push(c); S.lastCat[S.lang]=c.id; save(); V.addCat=false; return render(); }
  if (a==="addword"){ V.adding={text:"", cat:defaultAddCat()}; return render(); }
  if (a==="canceladd"){ V.adding=null; return render(); }
  if (a==="createword") return createWord();
  if (a==="makecards") return makeCards();
  if (a==="checkkey") return checkKey();
  if (a==="gosettings"){ V.tab="settings"; V.screen=null; V.adding=null; window.scrollTo(0,0); return render(); }
  if (a==="signin") return doAuth("in");
  if (a==="signup") return doAuth("up");
  if (a==="signout"){ sb.auth.signOut().then(()=>{ sbUser = null; SY.status = "Вы вышли. Данные остались на этом устройстве."; render(); }); return; }
  if (a==="takecloud"){ const d = SY.ask.remote; SY.ask = null; applyCloud(d.data); S.sync = {lastRemote:d.updated_at, dirty:false, linked:sbUser.id}; persist(); SY.status = "Данные загружены из облака"; SY.err = ""; return render(); }
  if (a==="takelocal"){ SY.ask = null; SY.err = ""; return push(); }
  if (a==="syncnow"){ SY.status=""; return pull(); }
  if (a==="export") return exportBackup();
  if (a==="import"){ document.getElementById("importfile").click(); return; }
  if (a==="reset"){ if (confirm("Удалить все слова, категории и прогресс на этом устройстве?")){ const k=S.settings; S=freshState(); Object.assign(S.settings,{aiKey:k.aiKey, aiModel:k.aiModel, aiFast:k.aiFast, aiModels:k.aiModels}); save(); V={tab:"learn",screen:null}; render(); } return; }
});
document.addEventListener("keydown", e => {
  if (e.key!=="Enter") return;
  if (e.target.id==="newword"){ e.preventDefault(); createWord(); }
  if (e.target.id==="a-pass"){ e.preventDefault(); doAuth("in"); }
  if (e.target.id==="tin" && !e.shiftKey){ e.preventDefault(); trainCheck(); }
  if (e.target.id==="newcat"){ e.preventDefault(); document.querySelector('[data-act="savecat"]').click(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.note){ L().words[t.dataset.note].note = t.value; save(); }
  if (t.id==="newword" && V.adding){ V.adding.text = t.value; }
  if (t.id==="tin" && V.screen?.type==="train"){ V.screen.text = t.value; }
  if (t.id==="s-key"){ S.settings.aiKey=t.value.trim(); V.keyMsg=null; save(); }
  if (t.id==="s-rate"){ S.settings.rate=+t.value; document.getElementById("ratev").textContent=t.value; save(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id==="catsel"){ S.sel[S.lang]=t.value; save(); render(); }
  if (t.id==="addcatsel" && V.adding){ V.adding.cat=t.value; V.adding.msg=""; S.lastCat[S.lang]=t.value; save(); render(); }
  if (t.id==="s-new"){ S.settings.newPerDay=+t.value; save(); }
  if (t.id==="s-mode"){ S.settings.mode=t.value; save(); }
  if (t.id==="importfile" && t.files?.[0]){ importBackup(t.files[0]); t.value = ""; }
  if (t.id==="s-auto"){ S.settings.autoSpeak=t.checked; save(); }
  if (t.id==="s-front"){ S.settings.front=t.value; save(); }
  if (t.dataset.pick !== undefined && V.adding){ V.adding.pick = t.dataset.pick==="all" ? "all" : +t.dataset.pick; V.adding.msg=""; render(); }
  if (t.id==="s-model"){ S.settings.aiModel=t.value; save(); }
  if (t.id==="s-fast"){ S.settings.aiFast=t.value; save(); }
  if (t.id==="s-voice"){ S.settings.voice=t.value; save(); speak("advantage"); }
});

render();
initSync();
</script>
</body>
